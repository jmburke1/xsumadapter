plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.jmburke1'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.json:json:20250107'
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.+'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'xsumadapter'
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jmburke1/xsumadapter')

            credentials {
                username = 'batman' //findProperty('gpr.user') should have worked.  I have the properties file in my '.gradle' directory
                password = 'not_really_my_password' //findProperty('gpr.key') should have worked.  I have the properties file in my '.gradle' directory
            }
        }
    }
}
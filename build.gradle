plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.jmburke1'


def isPublishingingRequested = gradle.startParameter.taskNames.any { it.contains('publish') }
// Abort immediately if the version property is missing
if (isPublishingingRequested) {
    if(!project.hasProperty('versionParam')) {
        throw new GradleException(
                "Missing required property: 'versionParam'. " +
                        "You must supply a version using: ./gradlew publish -PversionParam=X.Y.Z"
        )
    }
    version = project.property('versionParam')
}

// Assign the verified property to the project version

//Also abort immediately if the github environment variables are missing.
def githubActor = System.getenv("GITHUB_ACTOR")
def githubToken = System.getenv("GITHUB_TOKEN")
if(isPublishingingRequested && !(githubActor && githubToken)) {
    throw new GradleException(
            "Missing required environment variables: 'GITHUB_ACTOR' and/or 'GITHUB_TOKEN'. " +
            "Please set them in your terminal before publishing."
    )
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.json:json:20250107'
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.+'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://github.com")
            credentials {
                username = githubActor
                password = githubToken
            }
        }
    }
}